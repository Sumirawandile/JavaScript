<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Mouse Over Event</h2>
    <div id="box"
    style="width:200px;height:100px;background:skyblue;text-align: center;line-height: 100px;">Move Mouse Here</div>
    <script>
        document.getElementById("box").addEvenetListener("mouseover",function(){
            this.style.backgroundColor = "yellow";
            this.innerHTML = "Mouse is Over";

        });
    </script>
</body>
</html>
