<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Information - SIT Nagpur</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrap">

    <header class="site-header">
      <h1>Student Information</h1>
    </header>

    <div class="quote-strip">
      "Vasudhaiva Kutumbakam" - the world as one family
    </div>

    <!-- Small icon row so the page doesn't feel empty -->
    <div class="mini-facts">
      <div class="mini-fact">
        <div class="mini-fact-icon">&#127891;</div>
        <div class="mini-fact-text"><strong>B.Tech CSE</strong>Batch 2024-28</div>
      </div>
      <div class="mini-fact">
        <div class="mini-fact-icon">&#128218;</div>
        <div class="mini-fact-text"><strong>Semester 5</strong>Symbiosis Institute</div>
      </div>
      <div class="mini-fact">
        <div class="mini-fact-icon">&#128100;</div>
        <div class="mini-fact-text"><strong>Student Record</strong>Auto-generated below</div>
      </div>
    </div>

    <main class="center-main">
      <div class="student-card">

        <div id="studentInfo" class="info-box">
          <p style="color:#999;">Click the button below to display student information.</p>
        </div>

        <div class="action-row">
          <button id="showInfoBtn">Show My Info</button>
          <a href="department.html" class="btn-link" style="background-color:#dc3545;color:#fff;">&#8592; Back to Department Page</a>
        </div>

      </div>
    </main>

    <footer>
      <p>&copy; 2026 SIT Nagpur - CSE Department</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
