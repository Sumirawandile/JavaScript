<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Insta vs Study Time Tracker</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    background: #ffffff;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    text-align: center;
    width: 340px;
  }
  h2 {
    color: #333;
    margin-bottom: 10px;
  }
  p.subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 20px;
  }
  input {
    width: 90%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-bottom: 15px;
  }
  button {
    padding: 10px 18px;
    margin: 5px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    color: white;
  }
  #startBtn { background: #e1306c; }   /* insta-ish pink */
  #startBtn:hover { background: #c42a5e; }
  #cancelBtn { background: #888; }
  #cancelBtn:hover { background: #666; }
  #status {
    margin-top: 18px;
    font-size: 15px;
    font-weight: bold;
    min-height: 20px;
  }
  .running { color: #e1306c; }
  .studying { color: green; }
  .error { color: orange; }
  #countdown {
    font-size: 13px;
    color: #555;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="container">
  <h2>📱 Insta vs 📚 Study</h2>
  <p class="subtitle">Enter Instagram minutes — you'll get a study reminder once time's up</p>

  <input type="text" id="minutesInput" placeholder="e.g. 1">
  <br>
  <button id="startBtn" onclick="startInstaTimer()">Start Insta Timer</button>
  <button id="cancelBtn" onclick="cancelTimer()">Cancel</button>

  <div id="status"></div>
  <div id="countdown"></div>
</div>

<script>
  // Closure to track how many times the reminder has fired
  function createReminderTracker() {
    let count = 0;
    return function () {
      count++;
      return count;
    };
  }
  const getReminderCount = createReminderTracker();

  let timerId = null;       // holds setTimeout reference (so we can cancel it)
  let intervalId = null;    // holds setInterval reference (for live countdown)

  function startInstaTimer() {
    const statusDiv = document.getElementById("status");
    const countdownDiv = document.getElementById("countdown");
    const inputValue = document.getElementById("minutesInput").value;

    try {
      // Validation
      if (inputValue.trim() === "") {
        throw new Error("Please enter how many minutes you'll spend on Insta.");
      }
      const minutes = Number(inputValue);
      if (isNaN(minutes) || minutes <= 0) {
        throw new Error("Enter a valid positive number of minutes.");
      }

      // Clear any previous timer before starting a new one
      cancelTimer();

      const totalSeconds = Math.round(minutes * 60);
      let secondsLeft = totalSeconds;

      statusDiv.textContent = "📱 Scrolling Instagram... enjoy responsibly!";
      statusDiv.className = "running";
      countdownDiv.textContent = `Time left: ${secondsLeft}s`;

      // Live countdown, updates every second
      intervalId = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          countdownDiv.textContent = `Time left: ${secondsLeft}s`;
        } else {
          countdownDiv.textContent = "";
          clearInterval(intervalId);
        }
      }, 1000);

      // The actual reminder, fires once after the chosen time
      timerId = setTimeout(() => {
        const reminderNumber = getReminderCount();
        alert(`⏰ Reminder #${reminderNumber}: Time's up! Close Instagram and go study 📚`);

        statusDiv.textContent = "📚 Reminder sent — time to study!";
        statusDiv.className = "studying";
        clearInterval(intervalId);
        countdownDiv.textContent = "";
      }, totalSeconds * 1000);

    } catch (error) {
      statusDiv.textContent = `⚠️ ${error.message}`;
      statusDiv.className = "error";
    }
  }

  function cancelTimer() {
    if (timerId) {
      clearTimeout(timerId);
      timerId = null;
    }
    if (intervalId) {
      clearInterval(intervalId);
      intervalId = null;
    }
    document.getElementById("countdown").textContent = "";
  }
</script>

</body>
</html>
